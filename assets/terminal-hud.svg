<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Terminal with HUD preview">
  <defs>
    <style>
      .bg{fill:#071026}
      .term{fill:#0b1220;stroke:#16202b}
      .text{font:12px/1.2 Inter, sans-serif; fill:#a7d3ff}
      .hud{fill:rgba(138,92,246,0.12)}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="8"/>
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="680" height="200" rx="8" class="term" />
    <g transform="translate(18,22)" class="text">
      <text x="0" y="0">$ git clone https://github.com/albin170/project</text>
      <text x="0" y="22">$ cd project</text>
      <text x="0" y="44">$ npm run start</text>
    </g>
    <g transform="translate(540,18)" class="hud">
      <rect x="0" y="0" width="120" height="60" rx="6"/>
      <text x="10" y="20" class="text">HUD</text>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -4" dur="5s" repeatCount="indefinite"/>
  </g>
</svg>
