<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Project cube preview">
  <defs>
    <style>
      .bg{fill:#071026}
      .cube-face{fill:#0ea5a4;stroke:#061021;stroke-width:1}
      .label{font:12px/1.1 Inter, sans-serif; fill:#071026}
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="8"/>
  <g transform="translate(240,140)">
    <!-- simulated 3D cube with rotated squares -->
    <g id="faces">
      <rect x="-50" y="-50" width="100" height="100" class="cube-face" rx="6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text class="label" x="0" y="6" text-anchor="middle">Project Name</text>
    </g>
  </g>
</svg>
